# Axiom 的 Nginx 反向代理配置。
# 安装到 /etc/nginx/conf.d/axiom.conf，并把 axiom.example.com 换成你的域名。
# 完整步骤见 README「部署」一节。

upstream axiom {
    # next start 只监听本机回环地址，外部只能经由 Nginx 访问。
    # Axiom 使用 SQLite 与进程内任务队列，只能跑单个实例，不要在这里加多个 server。
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name axiom.example.com;

    # Let's Encrypt 的 HTTP-01 校验（签发与续期都会用到）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name axiom.example.com;

    ssl_certificate     /etc/letsencrypt/live/axiom.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axiom.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:axiom_ssl:10m;
    ssl_session_timeout 1d;

    # Axiom 没有账号系统，且设置页保存着模型 API Key，
    # 所以必须在这里挡一层访问控制。用户名密码文件的生成方法见 README。
    auth_basic           "Axiom";
    auth_basic_user_file /etc/nginx/.axiom-htpasswd;
    # 只想让固定 IP 访问时，可以改用（或叠加）白名单：
    # allow 203.0.113.10;
    # deny  all;
    # satisfy all;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "same-origin" always;

    # 资料上传上限是 50MB（UPLOAD_MAX_BYTES），multipart 会略大一点。
    client_max_body_size 55m;

    location / {
        proxy_pass http://axiom;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 对话回复与复盘会在一次请求里等待模型返回，单次模型调用最长 180 秒
        # （LLM_TIMEOUT_MS），含重试可能更久，这里留足余量。
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        # 上传大文件时直接流给应用，不落 Nginx 临时文件。
        proxy_request_buffering off;
    }
}
